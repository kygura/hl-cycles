name: collect

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "5 0 * * *"
  workflow_dispatch: {}

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend (static API mode)
        env:
          VITE_STATIC: "1"
        run: bun run build

      - name: Collect data and export static API
        id: cron
        continue-on-error: true
        run: |
          if [ "${{ github.event.schedule == '5 0 * * *' || github.event_name == 'workflow_dispatch' }}" = "true" ]; then
            bun run cron -- --backfill
          else
            bun run cron
          fi

      - name: Commit collected data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.event.schedule == '5 0 * * *' || github.event_name == 'workflow_dispatch' }}" = "true" ]; then
            git add data/
          else
            git add data/snapshots.jsonl
          fi
          git diff --cached --quiet || (git commit -m "chore(data): collect $(date -u +%Y-%m-%dT%H:%M:%SZ)" && git pull --rebase && git push)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Fail if collection errored
        if: steps.cron.outcome == 'failure'
        run: exit 1

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
