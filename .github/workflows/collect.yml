name: collect

on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "5 0 * * *"
  workflow_dispatch: {}

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      export-ok: ${{ steps.export_check.outputs.exists }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Collected data lives on the `data` branch (Vercel doesn't deploy it, see vercel.json), so
      # start each run from its latest data/ rather than whatever main last had synced.
      - name: Restore data from data branch
        run: |
          if git fetch origin data; then
            rm -rf data
            git checkout FETCH_HEAD -- data
          else
            echo "restore: no data branch yet, using data/ from main"
          fi

      - name: Collect data
        id: cron
        continue-on-error: true
        env:
          BGEOMETRICS_TOKEN: ${{ secrets.BGEOMETRICS_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ "${{ github.event.schedule == '5 0 * * *' || github.event_name == 'workflow_dispatch' }}" = "true" ]; then
            bun run cron -- --backfill
          else
            bun run cron
          fi

      - name: Commit collected data
        if: always()
        env:
          DATA_AUTHOR_NAME: ${{ vars.DATA_AUTHOR_NAME }}
          DATA_AUTHOR_EMAIL: ${{ vars.DATA_AUTHOR_EMAIL }}
          IS_BACKFILL: ${{ github.event.schedule == '5 0 * * *' || github.event_name == 'workflow_dispatch' }}
        run: |
          # Commits must be authored as the Hobby team owner (see SPEC.md 3.1) or Vercel won't
          # deploy them on a private repo. Repo vars set to that identity; fall back to the bot
          # identity (deploy just won't trigger) if the vars aren't set yet.
          git config user.name "${DATA_AUTHOR_NAME:-github-actions[bot]}"
          git config user.email "${DATA_AUTHOR_EMAIL:-41898283+github-actions[bot]@users.noreply.github.com}"

          # Data commits go to the `data` branch, which Vercel ignores (vercel.json), so the
          # 48/day pushes don't hit Vercel's GitHub fetch rate limit. main only receives a data
          # sync a few times a day (below), and that is what triggers a Vercel deploy.
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          rm -rf "$RUNNER_TEMP/data" && cp -r data "$RUNNER_TEMP/data"

          for attempt in 1 2 3; do
            git fetch origin main
            if git fetch origin data; then base=FETCH_HEAD; else base=origin/main; fi
            git checkout -f -B data "$base"
            rm -rf data && cp -r "$RUNNER_TEMP/data" data
            git add -A data/
            if git diff --cached --quiet; then
              echo "commit: nothing to commit"
              break
            fi
            git commit -m "chore(data): collect $stamp"
            if git push origin data; then break; fi
            echo "commit: push attempt $attempt failed, retrying..."
            sleep $((attempt * 5))
            if [ "$attempt" = 3 ]; then
              echo "::error::commit: failed to push collected data after 3 attempts"
              git checkout -f -B main origin/main
              rm -rf data && cp -r "$RUNNER_TEMP/data" data
              exit 1
            fi
          done

          # Back on main for the build below (and the sync), carrying this run's data.
          git checkout -f -B main origin/main
          rm -rf data && cp -r "$RUNNER_TEMP/data" data

          # Sync data to main (-> one Vercel deploy) on the daily/backfill run and at 6-hour marks.
          hour=$(date -u +%H); minute=$(date -u +%M)
          if [ "$IS_BACKFILL" = "true" ] || { [ $((10#$hour % 6)) -eq 0 ] && [ $((10#$minute)) -lt 30 ]; }; then
            git add -A data/
            if git diff --cached --quiet; then
              echo "sync: main already up to date"
            else
              git commit -m "chore(data): sync $stamp"
              for attempt in 1 2 3; do
                if git pull --rebase --autostash origin main && git push origin main; then break; fi
                git rebase --abort || true
                echo "sync: push attempt $attempt failed, retrying..."
                sleep $((attempt * 5))
              done
            fi
          fi

      - name: Build static export
        id: build_export
        if: always()
        run: VITE_STATIC=1 bun run build && bun run export

      - name: Verify static export exists
        id: export_check
        if: always()
        run: |
          if [ "${{ steps.build_export.outcome }}" = "success" ] && [ -s frontend/dist/api/health.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@v4
        if: always() && steps.export_check.outputs.exists == 'true'
        with:
          path: frontend/dist

      # Keeps the job (and its badge/notifications) red on a real collection failure (including a
      # Phase 4 vector source with no successful fetch in over 3 days, see cronLogic.ts), without
      # blocking the deploy job below — that job checks export-ok directly rather than relying on
      # collect's overall pass/fail, since a partial cron failure (e.g. one source down) still
      # produces a valid, deployable export.
      - name: Fail if collection errored
        if: steps.cron.outcome == 'failure'
        run: exit 1

  deploy:
    needs: collect
    if: always() && needs.collect.outputs.export-ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
