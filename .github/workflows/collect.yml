name: collect

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "5 0 * * *"
  workflow_dispatch: {}

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      export-ok: ${{ steps.export_check.outputs.exists }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Collect data
        id: cron
        continue-on-error: true
        env:
          BGEOMETRICS_TOKEN: ${{ secrets.BGEOMETRICS_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ "${{ github.event.schedule == '5 0 * * *' || github.event_name == 'workflow_dispatch' }}" = "true" ]; then
            bun run cron -- --backfill
          else
            bun run cron
          fi

      - name: Commit collected data
        if: always()
        env:
          DATA_AUTHOR_NAME: ${{ vars.DATA_AUTHOR_NAME }}
          DATA_AUTHOR_EMAIL: ${{ vars.DATA_AUTHOR_EMAIL }}
          RUN_NUMBER: ${{ github.run_number }}
          IS_BACKFILL: ${{ github.event.schedule == '5 0 * * *' || github.event_name == 'workflow_dispatch' }}
        run: |
          # Commits must be authored as the Hobby team owner (see vercel.json / SPEC.md 3.1) or
          # Vercel won't deploy them on a private repo. Repo vars set to that identity; fall back
          # to the bot identity (deploy just won't trigger) if the vars aren't set yet.
          git config user.name "${DATA_AUTHOR_NAME:-github-actions[bot]}"
          git config user.email "${DATA_AUTHOR_EMAIL:-41898283+github-actions[bot]@users.noreply.github.com}"

          # The site is built directly from these committed files (both Vercel's build and this
          # workflow's own Pages export run `bun run export` against them), so every run — 15-minute
          # or daily — commits all of data/, not just snapshots.jsonl.
          git add data/

          if git diff --cached --quiet; then
            echo "commit: nothing to commit"
            exit 0
          fi

          # vercel.json's ignoreCommand skips the Vercel build for a data commit whose subject
          # carries this marker (thins ~96/day 15-minute pushes down to roughly every 30 minutes,
          # to stay under the Hobby plan's 100 deploys/day). The daily/backfill run always builds.
          subject="chore(data): collect $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "$IS_BACKFILL" != "true" ] && [ $((RUN_NUMBER % 2)) -eq 1 ]; then
            subject="$subject [vercel-skip]"
          fi
          git commit -m "$subject"

          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              exit 0
            fi
            git rebase --abort || true
            echo "commit: push attempt $attempt failed, retrying..."
            sleep $((attempt * 5))
          done
          echo "::error::commit: failed to push collected data after 3 attempts"
          # Working tree may hold a locally-committed data/ that never made it to origin (and any
          # abandoned rebase state) -- reset data/ to origin's so the build below still runs on
          # clean, deployable data instead of a half-merged local commit.
          git fetch origin main
          git checkout origin/main -- data/
          exit 1

      - name: Build static export
        id: build_export
        if: always()
        run: VITE_STATIC=1 bun run build && bun run export

      - name: Verify static export exists
        id: export_check
        if: always()
        run: |
          if [ "${{ steps.build_export.outcome }}" = "success" ] && [ -s frontend/dist/api/health.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@v4
        if: always() && steps.export_check.outputs.exists == 'true'
        with:
          path: frontend/dist

      # Keeps the job (and its badge/notifications) red on a real collection failure (including a
      # Phase 4 vector source with no successful fetch in over 3 days, see cronLogic.ts), without
      # blocking the deploy job below — that job checks export-ok directly rather than relying on
      # collect's overall pass/fail, since a partial cron failure (e.g. one source down) still
      # produces a valid, deployable export.
      - name: Fail if collection errored
        if: steps.cron.outcome == 'failure'
        run: exit 1

  deploy:
    needs: collect
    if: always() && needs.collect.outputs.export-ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
