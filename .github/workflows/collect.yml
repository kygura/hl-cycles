name: collect

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "5 0 * * *"
  workflow_dispatch: {}

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      export-ok: ${{ steps.export_check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend (static API mode)
        env:
          VITE_STATIC: "1"
        run: bun run build

      - name: Collect data and export static API
        id: cron
        continue-on-error: true
        run: |
          if [ "${{ github.event.schedule == '5 0 * * *' || github.event_name == 'workflow_dispatch' }}" = "true" ]; then
            bun run cron -- --backfill
          else
            bun run cron
          fi

      - name: Commit collected data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"

          if [ "${{ github.event.schedule == '5 0 * * *' || github.event_name == 'workflow_dispatch' }}" = "true" ]; then
            git add data/
          else
            git add data/snapshots.jsonl
            # refreshAll() also rewrites the tracked candle/funding files, but the 15m path only
            # wants the snapshot committed. Discard those unstaged changes so the tree is clean for
            # `git pull --rebase` below — a dirty tree makes it refuse outright even with no real
            # conflict. Nothing lost: those files get refetched incrementally next run either way.
            git checkout -- data/ ':!data/snapshots.jsonl' 2>/dev/null || true
          fi

          if git diff --cached --quiet; then
            echo "commit: nothing to commit"
            exit 0
          fi
          git commit -m "chore(data): collect $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              exit 0
            fi
            echo "commit: push attempt $attempt failed, retrying..."
            sleep $((attempt * 5))
          done
          echo "::error::commit: failed to push collected data after 3 attempts"
          exit 1

      - name: Verify static export exists
        id: export_check
        if: always()
        run: |
          if [ -s frontend/dist/api/health.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@v3
        if: always() && steps.export_check.outputs.exists == 'true'
        with:
          path: frontend/dist

      # Keeps the job (and its badge/notifications) red on a real collection failure, without
      # blocking the deploy job below — that job checks export-ok directly rather than relying on
      # collect's overall pass/fail, since a partial cron failure (e.g. one source down) still
      # produces a valid, deployable export.
      - name: Fail if collection errored
        if: steps.cron.outcome == 'failure'
        run: exit 1

  deploy:
    needs: collect
    if: always() && needs.collect.outputs.export-ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
